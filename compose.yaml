name: ovirt-inventory

services:
  app:
    image: ${OVIRT_INVENTORY_IMAGE:-ghcr.io/dennis-au/ovirt_stocktake:v0.1.13}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OVIRT_INVENTORY_HOST: 0.0.0.0
      OVIRT_INVENTORY_PORT: "3000"
      OVIRT_INVENTORY_DB_PATH: /data/ovirt-inventory.sqlite
      OVIRT_INVENTORY_DATABASE_URL: postgresql://${POSTGRES_USER:-ovirt_inventory}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ovirt_inventory}
      OVIRT_INVENTORY_DATABASE_SSL: "false"
      OVIRT_INVENTORY_METRICS_BACKEND: postgres
      OVIRT_INVENTORY_COLLECTOR_ENABLED: "true"
      OVIRT_INVENTORY_INVENTORY_SYNC_MINUTES: ${OVIRT_INVENTORY_INVENTORY_SYNC_MINUTES:-15}
      OVIRT_INVENTORY_METRICS_SYNC_MINUTES: ${OVIRT_INVENTORY_METRICS_SYNC_MINUTES:-5}
      OVIRT_INVENTORY_SESSION_SECRET: ${OVIRT_INVENTORY_SESSION_SECRET:?Set OVIRT_INVENTORY_SESSION_SECRET in .env}
      OVIRT_INVENTORY_ENCRYPTION_KEY: ${OVIRT_INVENTORY_ENCRYPTION_KEY:?Set OVIRT_INVENTORY_ENCRYPTION_KEY in .env}
      OVIRT_INVENTORY_ADMIN_USERNAME: ${OVIRT_INVENTORY_ADMIN_USERNAME:-admin}
      OVIRT_INVENTORY_ADMIN_PASSWORD: ${OVIRT_INVENTORY_ADMIN_PASSWORD:?Set OVIRT_INVENTORY_ADMIN_PASSWORD in .env}
      OVIRT_INVENTORY_ADMIN_ROLE: ${OVIRT_INVENTORY_ADMIN_ROLE:-admin}
      OVIRT_INVENTORY_SESSION_TTL_HOURS: ${OVIRT_INVENTORY_SESSION_TTL_HOURS:-12}
      OVIRT_INVENTORY_SECURE_COOKIES: ${OVIRT_INVENTORY_SECURE_COOKIES:-false}
      OVIRT_INVENTORY_OVIRT_ALLOW_INSECURE_TLS: ${OVIRT_INVENTORY_OVIRT_ALLOW_INSECURE_TLS:-false}
    ports:
      - "${OVIRT_INVENTORY_HOST_PORT:-3001}:3000"
    volumes:
      - ./inventory_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ovirt_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-ovirt_inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
