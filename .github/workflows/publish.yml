name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ovirt_inventory
        run: |
          version=latest
          tags="--tag ${IMAGE}:latest"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${tags} --tag ${IMAGE}:${version}"
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="${version}" ${tags} --push .
